<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retirement Financial Planner Pro - Comprehensive Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <load src="src/partials/header.html" />

        <!-- Main Layout -->
        <div class="main-layout">
            <!-- Sidebar Navigation -->
            <load src="src/partials/sidebar.html" />

            <!-- Main Content Area -->
            <div class="main-content" id="dashboard-top">
                <!-- Dashboard Metrics (Coach + Key Metrics + Money Flow) -->
                <load src="src/partials/dashboard-metrics.html" />

                <!-- Comprehensive Metrics Dashboard -->
                <load src="src/partials/comprehensive-metrics.html" />

                <!-- Charts Grid (Strict 3-Across Layout) -->
                <div class="dashboard-grid">
                    <!-- Row 1: Executive Summary & Planning (2+2+2) -->
                    <load src="src/partials/charts/year-explorer.html" />
                    <load src="src/partials/charts/milestones.html" />
                    <load src="src/partials/charts/gap-calculator.html" />

                    <!-- Row 2: Portfolio & Income (2+2+2) -->
                    <load src="src/partials/charts/networth-charts.html" />
                    <!-- networth-charts.html contains Net Worth (span-2) + Allocation (span-2) = 4 cols -->
                    <!-- income-charts.html contains Income Sources (span-2) -->

                    <!-- Row 3: Cash Flow Analysis (2+2+2) -->
                    <!-- income-charts.html contains Money Flow (span-2) + Surplus/Gap (span-2) = 4 cols -->
                    <load src="src/partials/charts/income-charts.html" />
                    <!-- expense-tax-charts.html contains Expenses (span-2) -->

                    <!-- Row 4: Expense Breakdown & Healthcare (2+2+2) -->
                    <!-- expense-tax-charts.html contains Expense Pie (span-2) + Healthcare (span-2) = 4 cols -->
                    <load src="src/partials/charts/expense-tax-charts.html" />
                    <!-- Placeholder for 3rd item in Row 4 (2 cols needed) -->

                    <!-- Row 5: Tax & Social Security (2+2+2) -->
                    <load src="src/partials/charts/taxes.html" />
                    <!-- social-security.html contains SS Strategy (span-2) + SS Cumulative (span-2) = 4 cols -->
                    <load src="src/partials/charts/social-security.html" />

                    <!-- Row 6: Drawdown Strategy (2+2+2) -->
                    <!-- withdrawal-strategy-charts.html contains Withdrawal (span-2) + SWR (span-2) = 4 cols -->
                    <load src="src/partials/charts/withdrawal-strategy-charts.html" />
                    <!-- Swapped Financial Goals here -->
                    <load src="src/partials/charts/goals.html" />

                    <!-- Row 7: Roth Optimization & Monte Carlo (2+2+2) -->
                    <!-- roth.html contains Roth Plan (span-2) + Roth Delta (span-2) = 4 cols -->
                    <load src="src/partials/charts/roth.html" />
                    <!-- Moved Monte Carlo here to balance the row -->
                    <load src="src/partials/charts/montecarlo-analysis.html" />

                    <!-- Row 8: Explorers & Scenarios (2+2+2) -->
                    <load src="src/partials/charts/explorers.html" />
                    <load src="src/partials/charts/stress-test.html" />
                    <load src="src/partials/charts/sequence-risk.html" />

                    <!-- Row 9: Detailed Reporting (6) -->
                    <load src="src/partials/charts/data-tables.html" />

                    <!-- Placeholder containers for missing charts referenced in main.js -->
                    <div style="display:none;">
                        <canvas id="chartRealNominal"></canvas>
                        <canvas id="chartStackedPortfolio"></canvas>
                        <canvas id="chartIncomeReplacement"></canvas>
                        <canvas id="chartCumulativeTax"></canvas>
                        <canvas id="chartEffectiveTax"></canvas>
                        <canvas id="chartTaxBracket"></canvas>
                        <canvas id="chartRothConversion"></canvas>
                        <canvas id="chartRMD"></canvas>
                        <canvas id="chartMortgage"></canvas>
                        <canvas id="chartAccountTrends"></canvas>
                        <canvas id="chartScenarioComparison"></canvas>
                        <canvas id="chartLegacy"></canvas>
                        <canvas id="chartDebtPayoff"></canvas>
                        <canvas id="chartMarketRisk"></canvas>
                        <canvas id="chartRothExplorer"></canvas>
                    </div>
                </div>

                <!-- Footer -->
                <div class="card span-6">
                    <load src="src/partials/footer.html" />
                </div>
            </div> <!-- End main-content -->
        </div> <!-- End main-layout -->
    </div> <!-- End container -->

    <!-- Settings Panel & Modals -->
    <load src="src/partials/settings-and-modals.html" />

    <script type="module" src="src/main.js"></script>
</body>

</html>
