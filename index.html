<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retirement Financial Planner Pro - Comprehensive Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <load src="src/partials/header.html" />

        <!-- Main Layout -->
        <div class="main-layout">
            <!-- Sidebar Navigation -->
            <load src="src/partials/sidebar.html" />

            <!-- Main Content Area -->
            <div class="main-content" id="dashboard-top">
                <!-- Dashboard Metrics (Coach + Key Metrics + Money Flow) -->
                <load src="src/partials/dashboard-metrics.html" />

                <!-- Comprehensive Metrics Dashboard -->
                <load src="src/partials/comprehensive-metrics.html" />

                <!-- Charts Grid (Flattened to ensure injection) -->
                <div class="dashboard-grid">
                    <load src="src/partials/charts/year-explorer.html" />
                    <load src="src/partials/charts/networth-charts.html" />
                    <load src="src/partials/charts/income-charts.html" />
                    <load src="src/partials/charts/expense-tax-charts.html" />
                    <load src="src/partials/charts/taxes.html" />
                    <load src="src/partials/charts/withdrawal-strategy-charts.html" />
                    <load src="src/partials/charts/social-security.html" />
                    <load src="src/partials/charts/roth.html" />
                    <load src="src/partials/charts/montecarlo-analysis.html" />
                    <load src="src/partials/charts/explorers.html" />
                    <load src="src/partials/charts/data-tables.html" />

                    <!-- Placeholder containers for missing charts referenced in main.js -->
                    <div style="display:none;">
                        <canvas id="chartRealNominal"></canvas>
                        <canvas id="chartStackedPortfolio"></canvas>
                        <canvas id="chartIncomeReplacement"></canvas>
                        <canvas id="chartCumulativeTax"></canvas>
                        <canvas id="chartEffectiveTax"></canvas>
                        <canvas id="chartTaxBracket"></canvas>
                        <canvas id="chartRothConversion"></canvas>
                        <canvas id="chartRMD"></canvas>
                        <canvas id="chartMortgage"></canvas>
                        <canvas id="chartAccountTrends"></canvas>
                        <canvas id="chartScenarioComparison"></canvas>
                        <canvas id="chartSequenceRisk"></canvas>
                        <canvas id="chartLegacy"></canvas>
                        <canvas id="chartDebtPayoff"></canvas>
                        <canvas id="chartMarketRisk"></canvas>
                        <canvas id="chartRothExplorer"></canvas>
                    </div>
                </div>

                <!-- Footer -->
                <div class="card span-6">
                    <load src="src/partials/footer.html" />
                </div>
            </div> <!-- End main-content -->
        </div> <!-- End main-layout -->
    </div> <!-- End container -->

    <!-- Settings Panel & Modals -->
    <load src="src/partials/settings-and-modals.html" />

    <script type="module" src="src/main.js"></script>
</body>

</html>
