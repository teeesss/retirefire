<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Content Security Policy for XSS Protection -->
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self' https://api.coinbase.com https://cdnjs.cloudflare.com ws: wss:; worker-src 'self' blob:; child-src 'self' blob:; base-uri 'self'; form-action 'self';">

    <title>Retirement Financial Planner Pro - Comprehensive Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <load src="src/partials/header.html" />

        <!-- Main Layout -->
        <div class="main-layout">
            <!-- Sidebar Navigation -->
            <load src="src/partials/sidebar.html" />

            <!-- Main Content Area (Command Center Logic) -->
            <div class="main-content scroll-mt-32" id="dashboard-top">
                <!-- Master Layout Wrapper: Ultrawide Centered -->
                <div class="max-w-[2560px] mx-auto w-full px-4 flex flex-col gap-6">

                    <!-- ROW 1: Key Metrics (Strict 7-Column Grid) -->
                    <load src="src/partials/key-metrics.html" />

                    <!-- ROW 2: Comprehensive Metrics (Strict 6-Column Grid) -->
                    <load src="src/partials/comprehensive-metrics.html" />

                    <!-- ROW 3: Milestones / Goals (Full Width) -->
                    <div id="section-goals" class="scroll-mt-32"></div>
                    <div id="section-milestones" class="scroll-mt-32">
                        <load src="src/partials/charts/milestones.html" />
                    </div>

                    <!-- ROW 4: Plan Optimizer & Coach (Full Width) -->
                    <div class="w-full scroll-mt-32" id="section-coach">
                        <load src="src/partials/plan-optimizer.html" />
                    </div>

                    <!-- ROW 5: Tools & Calculators (3-Column Grid) -->
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 scroll-mt-32" id="section-tools">
                        <load src="src/partials/charts/year-explorer.html" />
                        <load src="src/partials/charts/data-tables.html" />
                        <load src="src/partials/charts/gap-calculator.html" />
                    </div>

                    <!-- ROW 6: Portfolio Charts (3-Column Grid) -->
                    <div id="section-legacy" class="scroll-mt-32"></div>
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 scroll-mt-32" id="section-networth">
                        <load src="src/partials/charts/networth-charts.html" />
                        <load src="src/partials/charts/allocation.html" />
                        <load src="src/partials/charts/legacy.html" />
                    </div>

                    <!-- ROW 7: Cash Flow Charts (3-Column Grid) -->
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 scroll-mt-32" id="section-income">
                        <load src="src/partials/charts/income-sources.html" />
                        <load src="src/partials/charts/surplus-gap.html" />
                        <load src="src/partials/charts/money-flow.html" />
                    </div>

                    <!-- ROW 8: Expense Charts (3-Column Grid) -->
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 scroll-mt-32" id="section-expenses">
                        <load src="src/partials/charts/expense-charts.html" />
                        <load src="src/partials/charts/expense-pie.html" />
                        <load src="src/partials/charts/healthcare.html" />
                    </div>

                    <!-- ROW 9: Tax & SS Charts (3-Column Grid) -->
                    <div id="section-socialsecurity" class="scroll-mt-32"></div>
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 scroll-mt-32" id="section-taxes">
                        <load src="src/partials/charts/taxes.html" />
                        <load src="src/partials/charts/social-security-strategy.html" />
                        <load src="src/partials/charts/social-security-comparison.html" />
                    </div>

                    <!-- ROW 10: Optimization Charts (3-Column Grid) -->
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 scroll-mt-32" id="section-roth">
                        <load src="src/partials/charts/roth.html" />
                        <load src="src/partials/charts/plan-improvement.html" />
                        <load src="src/partials/charts/tax-delta.html" />
                    </div>

                    <!-- ROW 11: Stress Test Charts (3-Column Grid) -->
                    <div id="section-explorers" class="scroll-mt-32"></div>
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 scroll-mt-32" id="section-stresstest">
                        <load src="src/partials/charts/explorers.html" />
                        <load src="src/partials/charts/stress-test.html" />
                        <load src="src/partials/charts/sequence-risk.html" />
                    </div>

                    <!-- ROW 12: Withdrawal Strategy (2-Column Grid) -->
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 scroll-mt-32" id="section-withdrawals">
                        <load src="src/partials/charts/withdrawal-strategy.html" />
                        <load src="src/partials/charts/safe-withdrawal.html" />
                    </div>

                    <!-- ROW 13: Monte Carlo (Full Width) -->
                    <div class="w-full scroll-mt-32" id="section-montecarlo">
                        <load src="src/partials/charts/montecarlo-analysis.html" />
                    </div>

                    <!-- Hidden Charts & Logic -->
                    <div style="display:none;">
                        <canvas id="chartRealNominal"></canvas>
                        <canvas id="chartStackedPortfolio"></canvas>
                        <canvas id="chartIncomeReplacement"></canvas>
                        <canvas id="chartCumulativeTax"></canvas>
                        <canvas id="chartEffectiveTax"></canvas>
                        <canvas id="chartTaxBracket"></canvas>
                        <canvas id="chartRothConversion"></canvas>
                        <canvas id="chartRMD"></canvas>
                        <canvas id="chartMortgage"></canvas>
                        <canvas id="chartAccountTrends"></canvas>
                        <canvas id="chartScenarioComparison"></canvas>
                        <canvas id="chartDebtPayoff"></canvas>
                        <canvas id="chartMarketRisk"></canvas>
                        <canvas id="chartRothExplorer"></canvas>
                    </div>

                    <!-- Footer -->
                    <div class="w-full mt-8">
                        <load src="src/partials/footer.html" />
                    </div>

                </div> <!-- End Master Layout Wrapper -->
            </div> <!-- End main-content -->
        </div> <!-- End main-layout -->
    </div> <!-- End container -->

    <!-- Settings Panel & Modals -->
    <load src="src/partials/settings-and-modals.html" />
    <load src="src/partials/modals/year-data-modal.html" />

    <script type="module" src="src/main.js"></script>
</body>

</html>
