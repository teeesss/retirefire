name: Vitest Logic Tests

on:
  push:
    branches: [ retirefire ]
  pull_request:
    branches: [ retirefire ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Run Vitest logic tests
      run: npx vitest run tests/unit/MonteCarlo.test.js tests/unit/Diagnostic.test.js
