<!-- Side-by-Side: Coach + Key Metrics -->
<div class="dashboard-grid" style="margin-bottom: 0;">
    <!-- Coach Insights (Span 1 - 1/3 width in 3-col grid) -->
    <div class="card span-1" id="coach-insights"
        style="background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(139, 92, 246, 0.1)); border: 1px solid var(--primary); display: flex; flex-direction: column;">
        <div class="card-header" style="margin-bottom: 0.5rem;">
            <div class="card-title">🤖 Plan Optimizer &amp; Coach</div>
        </div>
        <div id="coachMessageList" class="coach-list">
            <!-- Populated by JS -->
            <div style="color: var(--text-muted);">Analyzing your plan for optimizations...</div>
        </div>
    </div>

    <!-- Key Metrics Dashboard (Span 2 - 2/3 width) -->
    <div class="span-2">
        <!-- Explicit 7-column grid controlled by CSS breakpoints -->
        <div class="key-metrics-row">
            <div class="card clickable" onclick="scrollToSection('section-networth')">
                <div class="card-header">
                    <div>
                        <div class="card-title">Net Worth <span id="metricScenarioLabel"
                                class="scenario-badge">Avg</span></div>
                        <div class="card-value" id="metricCurrentNW" style="font-size: 1.1rem;">$4.24M</div>
                        <div class="card-subtitle" id="currentNWSubtitle">Age 50</div>
                    </div>
                </div>
                <div class="mini-chart" style="height: 40px;"><canvas id="sparkNW"></canvas></div>
            </div>

            <div class="card clickable" onclick="scrollToSection('section-networth')">
                <div class="card-header">
                    <div>
                        <div class="card-title">Peak NW</div>
                        <div class="card-value" id="metricPeakNW" style="font-size: 1.1rem;">$233.8M</div>
                    </div>
                    <span class="trend up" id="metricPeakGrowth" style="font-size: 0.65rem;">+5,422%</span>
                </div>
                <div class="mini-chart" style="height: 40px;"><canvas id="sparkGrowth"></canvas></div>
            </div>

            <div class="card clickable" onclick="scrollToSection('section-montecarlo')">
                <div class="card-header">
                    <div>
                        <div class="card-title">Success</div>
                        <div class="card-value" id="metricSuccess" style="font-size: 1.1rem;">99%</div>
                    </div>
                </div>
                <div class="mini-chart" style="height: 40px; display: flex; justify-content: center;">
                    <canvas id="gaugeSuccess"></canvas>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <div>
                        <div class="card-title">Wellness</div>
                        <div class="card-value" id="metricWellness" style="font-size: 1.1rem;">85</div>
                    </div>
                </div>
                <div style="font-size: 1.25rem; text-align: center;" id="wellnessEmoji">⭐</div>
            </div>

            <div class="card clickable" onclick="scrollToSection('section-income')">
                <div class="card-header">
                    <div>
                        <div class="card-title">Retire Age</div>
                        <div class="card-value" id="metricRetireAge" style="font-size: 1.1rem;">53</div>
                    </div>
                </div>
                <span class="trend up" style="font-size: 0.65rem;">&#127919; OK</span>
            </div>

            <div class="card clickable" onclick="scrollToSection('section-socialsecurity')">
                <div class="card-header">
                    <div>
                        <div class="card-title">SS Benefit</div>
                        <div class="card-value" id="metricSS" style="font-size: 1.1rem;">$2,739</div>
                    </div>
                </div>
            </div>

            <div class="card clickable" onclick="scrollToSection('section-taxes')">
                <div class="card-header">
                    <div>
                        <div class="card-title">Taxes</div>
                        <div class="card-value" id="metricTaxes" style="font-size: 1.1rem;">$7.0M</div>
                    </div>
                </div>
                <span class="trend down" style="font-size: 0.65rem;">&#128176; Opt</span>
            </div>
        </div>
    </div>
</div>

<!-- Savings Gap Calculator (Moved to specific location in main grid) -->
