<!-- Top Row: Key Metrics Dashboard (7-Across on Large Screens) -->
<div class="w-full mb-6" id="key-metrics-row-container">
    <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-3 w-full" id="key-metrics-row">
        <div class="card clickable p-3 text-center flex flex-col items-center justify-center min-w-0"
            onclick="scrollToSection('section-networth')" style="min-height: 100px;">
            <div class="text-[0.65rem] font-semibold text-muted uppercase tracking-wider mb-1">Net Worth <span
                    id="metricScenarioLabel" class="scenario-badge">Avg</span></div>
            <div class="text-lg font-bold truncate w-full" id="metricCurrentNW">$4.24M</div>
            <div class="text-[0.6rem] text-muted opacity-80" id="currentNWSubtitle">Age 50</div>
            <div class="w-full h-[30px] mt-2"><canvas id="sparkNW"></canvas></div>
        </div>

        <div class="card clickable p-3 text-center flex flex-col items-center justify-center min-w-0"
            onclick="scrollToSection('section-networth')" style="min-height: 100px;">
            <div class="text-[0.65rem] font-semibold text-muted uppercase tracking-wider mb-1">Peak NW</div>
            <div class="text-lg font-bold truncate w-full" id="metricPeakNW">$233.8M</div>
            <div class="text-[0.65rem] text-success font-bold mt-1" id="metricPeakGrowth">+5,422%</div>
            <div class="w-full h-[30px] mt-1"><canvas id="sparkGrowth"></canvas></div>
        </div>

        <div class="card clickable p-3 text-center flex flex-col items-center justify-center min-w-0"
            onclick="scrollToSection('section-montecarlo')" style="min-height: 100px;">
            <div class="text-[0.65rem] font-semibold text-muted uppercase tracking-wider mb-1">Success</div>
            <div class="text-lg font-bold truncate w-full" id="metricSuccess">99%</div>
            <div class="w-full h-[40px] mt-1 flex justify-center">
                <canvas id="gaugeSuccess"></canvas>
            </div>
        </div>

        <div class="card p-3 text-center flex flex-col items-center justify-center min-w-0" style="min-height: 100px;">
            <div class="text-[0.65rem] font-semibold text-muted uppercase tracking-wider mb-1">Wellness</div>
            <div class="text-lg font-bold truncate w-full" id="metricWellness">85</div>
            <div class="text-xl mt-1" id="wellnessEmoji">⭐</div>
        </div>

        <div class="card clickable p-3 text-center flex flex-col items-center justify-center min-w-0"
            onclick="scrollToSection('section-income')" style="min-height: 100px;">
            <div class="text-[0.65rem] font-semibold text-muted uppercase tracking-wider mb-1">Retire Age</div>
            <div class="text-lg font-bold truncate w-full" id="metricRetireAge">53</div>
            <div class="text-[0.65rem] text-success font-bold mt-1">🎯 OK</div>
        </div>

        <div class="card clickable p-3 text-center flex flex-col items-center justify-center min-w-0"
            onclick="scrollToSection('section-socialsecurity')" style="min-height: 100px;">
            <div class="text-[0.65rem] font-semibold text-muted uppercase tracking-wider mb-1">SS Benefit</div>
            <div class="text-lg font-bold truncate w-full" id="metricSS">$2,739</div>
            <div class="text-[0.65rem] text-muted opacity-80 mt-1" id="metricSSAge">Age 67</div>
        </div>

        <div class="card clickable p-3 text-center flex flex-col items-center justify-center min-w-0"
            onclick="scrollToSection('section-taxes')" style="min-height: 100px;">
            <div class="text-[0.65rem] font-semibold text-muted uppercase tracking-wider mb-1">Taxes</div>
            <div class="text-lg font-bold truncate w-full" id="metricTaxes">$7.0M</div>
            <div class="text-[0.65rem] text-primary font-bold mt-1">💰 Opt</div>
        </div>
    </div>
</div>

<!-- SECTION 3: Plan Optimizer & Coach Row (Full Width Horizontal) -->
<div class="w-full mb-6" id="coach-insights">
    <div class="card border-primary/30 overflow-hidden"
        style="background: linear-gradient(135deg, rgba(59, 130, 246, 0.05), rgba(139, 92, 246, 0.05));">
        <div class="card-header border-b border-white/10 pb-2 mb-3">
            <div class="card-title text-primary"><span class="mr-2">🤖</span> Plan Optimizer &amp; Coach</div>
        </div>
        <div id="coachMessageList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"
            style="grid-template-columns: repeat(3, 1fr) !important;">
            <!-- Populated by JS -->
            <div class="text-muted p-4">Analyzing your plan for optimizations...</div>
        </div>
    </div>
</div>
