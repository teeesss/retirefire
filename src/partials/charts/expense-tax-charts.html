<!-- Expense & Tax Charts -->
<div class="card span-4" id="section-expenses">
    <div class="card-header">
        <div class="card-title">
            <span>&#128181; Expenses</span>
            <a href="#dashboard-top" class="back-to-top-btn">↑ Top</a>
        </div>
    </div>
    <div class="chart-container large">
        <canvas id="chartExpenses"></canvas>
    </div>
</div>

<div class="card span-2">
    <div class="card-header">
        <div class="card-title">
            <span>&#129367; Pie - <span id="expenseYearLabel">2026</span></span>
            <a href="#dashboard-top" class="back-to-top-btn">↑ Top</a>
        </div>
    </div>
    <div class="chart-container large">
        <canvas id="chartExpensePie"></canvas>
    </div>
</div>

<div class="card span-2">
    <div class="card-header">
        <div class="card-title">
            <span>&#127973; Healthcare</span>
            <a href="#dashboard-top" class="back-to-top-btn">↑ Top</a>
        </div>
    </div>
    <div class="chart-container large">
        <canvas id="chartHealthcare"></canvas>
    </div>
    <div class="stats-row"
        style="margin-top: 1rem; display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; text-align: center;">
        <div class="stat-item">
            <div class="label" style="font-size: 0.65rem; color: var(--text-muted);">Pre-65</div>
            <div class="value negative" id="preMedicareCost" style="font-size: 0.8rem; font-weight: 700;">$0</div>
        </div>
        <div class="stat-item">
            <div class="label" style="font-size: 0.65rem; color: var(--text-muted);">65+</div>
            <div class="value" id="medicareCost" style="font-size: 0.8rem; font-weight: 700;">$0</div>
        </div>
        <div class="stat-item">
            <div class="label" style="font-size: 0.65rem; color: var(--text-muted);">90+</div>
            <div class="value negative" id="ltcCost" style="font-size: 0.8rem; font-weight: 700;">$0</div>
        </div>
    </div>
</div>
