<!-- Expense & Tax Charts -->
<div class="card span-3" id="section-expenses">
    <div class="card-header">
        <div class="card-title">&#128181; Expense Categories Breakdown</div>
    </div>
    <div class="chart-container large">
        <canvas id="chartExpenses"></canvas>
    </div>
</div>

<div class="card span-3">
    <div class="card-header">
        <div class="card-title">&#129367; Expenses - <span id="expenseYearLabel">2026</span></div>
    </div>
    <div class="chart-container large">
        <canvas id="chartExpensePie"></canvas>
    </div>
</div>

<div class="card span-3">
    <div class="card-header">
        <div class="card-title">&#127973; Healthcare Cost Projection</div>
    </div>
    <div class="chart-container large">
        <canvas id="chartHealthcare"></canvas>
    </div>
    <div class="stats-row"
        style="margin-top: 1rem; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center;">
        <div class="stat-item">
            <div class="label" style="font-size: 0.7rem; color: var(--text-muted);">Pre-Medicare</div>
            <div class="value negative" id="preMedicareCost" style="font-weight: 700;">$0</div>
        </div>
        <div class="stat-item">
            <div class="label" style="font-size: 0.7rem; color: var(--text-muted);">Medicare (65+)</div>
            <div class="value" id="medicareCost" style="font-weight: 700;">$0</div>
        </div>
        <div class="stat-item">
            <div class="label" style="font-size: 0.7rem; color: var(--text-muted);">LTC (90+)</div>
            <div class="value negative" id="ltcCost" style="font-weight: 700;">$0</div>
        </div>
    </div>
</div>
