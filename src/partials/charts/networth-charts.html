<!-- Net Worth Projection -->
<div class="card span-6" id="section-networth">
    <div class="card-header">
        <div class="card-title">
            <span>&#128200; Net Worth Comparison</span>
            <a href="#dashboard-top" class="back-to-top-btn">↑ Top</a>
        </div>
        <div class="tab-container">
            <button class="tab active" onclick="setChartType('networth', 'scenario', this)">Scenarios</button>
            <button class="tab" onclick="setChartType('networth', 'account', this)">Accounts</button>
        </div>
    </div>
    <div class="chart-container large">
        <canvas id="chartNetWorth"></canvas>
    </div>
    <div id="netWorthLegend" class="legend"
        style="display: flex; gap: 10px; justify-content: center; margin-top: 5px; font-size: 0.7rem;"></div>
</div>

<div class="card span-6" id="section-allocation">
    <div class="card-header">
        <div class="card-title">
            <span>&#128202; Allocation - <span id="allocationYearLabel">2026</span></span>
            <a href="#dashboard-top" class="back-to-top-btn">↑ Top</a>
        </div>
    </div>
    <div class="chart-container large">
        <canvas id="chartAllocation"></canvas>
    </div>
</div>
