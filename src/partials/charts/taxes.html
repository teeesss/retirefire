<!-- Tax Charts -->
<div class="card span-4" id="section-taxes">
    <div class="card-header">
        <div class="card-title">
            <span>&#128203; Tax Burden & Effective Rate</span>
            <a href="#dashboard-top" class="back-to-top-btn">↑ Top</a>
        </div>
        <div class="tab-container">
            <button class="tab active" onclick="setChartType('taxes', 'total', this)">Total Tax</button>
            <button class="tab" onclick="setChartType('taxes', 'effective', this)">Effective Rate</button>
            <button class="tab" onclick="setChartType('taxes', 'bracket', this)">By Bracket</button>
        </div>
    </div>
    <div class="chart-container xlarge">
        <canvas id="chartTaxes"></canvas>
    </div>
</div>
