<!-- Roth Conversion Strategy Section -->
<div class="card span-2" id="section-roth">
    <div class="card-header">
        <div class="card-title">
            <span>🎯 Roth Conversion Plan</span>
            <a href="#dashboard-top" class="back-to-top-btn">↑ Top</a>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="rothConversionEnabled" checked onchange="toggleRothConversion()">
            <label for="rothConversionEnabled" style="font-size: 0.75rem;">Active</label>
        </div>
    </div>

    <div id="rothConversionContent">
        <!-- Quick Stats -->
        <div class="stats-row"
            style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; text-align: center;">
            <div class="stat-item">
                <div class="label" style="font-size: 0.6rem; color: var(--text-muted);">Converted</div>
                <div class="value" id="rothTotalConverted" style="font-size: 0.9rem; font-weight: 700;">$0</div>
            </div>
            <div class="stat-item">
                <div class="label" style="font-size: 0.6rem; color: var(--text-muted);">Tax Paid</div>
                <div class="value" id="rothTaxSavings" style="font-size: 0.9rem; font-weight: 700;">$0</div>
            </div>
            <div class="stat-item">
                <div class="label" style="font-size: 0.6rem; color: var(--text-muted);">NW Boost</div>
                <div class="value positive" id="rothLegacyBoost" style="font-size: 0.9rem; font-weight: 700;">$0</div>
            </div>
        </div>

        <!-- Strategy Controls -->
        <div style="background: rgba(0,0,0,0.02); border-radius: 8px; padding: 15px;">
            <label style="font-size: 0.75rem; font-weight: 600; margin-bottom: 8px; display: block;">Strategy
                Selection</label>
            <select id="rothStrategyMode" onchange="updateRothStrategy(this.value)"
                style="width: 100%; padding: 8px; margin-bottom: 15px;">
                <option value="manual">Manual Amount</option>
                <option value="bracket">Fill Tax Bracket</option>
                <option value="hybrid">Hybrid Strategy</option>
            </select>

            <div id="rothManualControls">
                <label style="font-size: 0.7rem; color: var(--text-muted); display: block; margin-bottom: 5px;">Annual
                    Amount</label>
                <input type="number" id="rothAmountInput" value="50000" step="5000"
                    oninput="updateRothConversionAmount(this.value)"
                    style="width: 100%; padding: 8px; margin-bottom: 10px;">
                <input type="range" id="rothAmountSlider" min="0" max="500000" step="5000" value="50000"
                    oninput="updateRothConversionAmount(this.value)" style="width: 100%;">
            </div>

            <div id="rothBracketControls" style="display: none;">
                <label style="font-size: 0.7rem; color: var(--text-muted); display: block; margin-bottom: 5px;">Target
                    Bracket</label>
                <select id="rothTargetBracket" onchange="updateRothTargetBracket(this.value)"
                    style="width: 100%; padding: 8px;">
                    <option value="12">12% Bracket</option>
                    <option value="22" selected>22% Bracket</option>
                    <option value="24">24% Bracket</option>
                </select>
            </div>

            <div style="margin-top: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div>
                    <label style="font-size: 0.7rem; color: var(--text-muted);">Start Year</label>
                    <input type="number" id="rothStartYear" value="2026" onchange="updateRothPeriod()"
                        style="width: 100%; padding: 8px;">
                </div>
                <div>
                    <label style="font-size: 0.7rem; color: var(--text-muted);">End Year</label>
                    <input type="number" id="rothEndYear" value="2047" onchange="updateRothPeriod()"
                        style="width: 100%; padding: 8px;">
                </div>
            </div>

            <button onclick="optimizeRothConversion()"
                style="width: 100%; margin-top: 20px; padding: 12px; background: var(--success); color: white; border: none; border-radius: 6px; font-weight: 700; cursor: pointer;">
                🎯 Optimize Plan
            </button>
        </div>
    </div>
</div>

<!-- Roth Comparison Results -->
<div class="card span-2">
    <div class="card-header">
        <div class="card-title">
            <span>📊 Plan Improvement (Delta)</span>
            <a href="#dashboard-top" class="back-to-top-btn">↑ Top</a>
        </div>
    </div>
    <div class="chart-container large">
        <canvas id="chartRothExplorer"></canvas>
    </div>
    <div style="margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 15px;">
        <div style="font-size: 0.75rem; font-weight: 600; text-align: center; margin-bottom: 10px;">⚖️ Cumulative Tax
            Delta</div>
        <div class="chart-container large">
            <canvas id="chartRothTaxImpact"></canvas>
        </div>
    </div>
</div>
