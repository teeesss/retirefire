<!-- Detailed Data Tables -->
<div class="card span-6" id="section-tables">
    <div class="card-header">
        <div class="card-title">&#128203; Year-by-Year Financial Data</div>
        <div class="tab-container" id="tableTabs" style="display: flex; gap: 5px; flex-wrap: wrap;">
            <button class="tab active" onclick="showDataTable('summary', this)">Summary</button>
            <button class="tab" onclick="showDataTable('accounts', this)">Accounts</button>
            <button class="tab" onclick="showDataTable('income', this)">Income</button>
            <button class="tab" onclick="showDataTable('expenses', this)">Expenses</button>
            <button class="tab" onclick="showDataTable('taxes', this)">Taxes</button>
            <button class="tab" onclick="showDataTable('roth', this)">Roth</button>
            <button class="tab" onclick="showDataTable('cashflow', this)">Cash Flow</button>
        </div>
        <div class="card-actions" style="display: flex; gap: 5px;">
            <button class="btn btn-outline btn-sm" onclick="exportPDF()">&#128229; Export PDF</button>
            <button class="btn btn-outline btn-sm" onclick="exportCSV()">&#128228; Export CSV</button>
        </div>
    </div>
    <div class="table-container" id="dataTableContainer"
        style="overflow-x: auto; margin-top: 15px; max-height: 600px; border-radius: 8px;">
        <!-- Populated by JS (showDataTable) -->
    </div>
</div>
