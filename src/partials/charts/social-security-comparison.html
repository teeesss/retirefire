<div class="card" id="section-sscomparison">
    <div class="card-header">
        <div class="card-title">
            <span>📈 Social Security Cumulative Comparison</span>
            <a href="#dashboard-top" class="back-to-top-btn">↑ Top</a>
        </div>
        <div class="control-group" style="margin-left: auto;">
            <select id="ssViewToggle" class="btn-sm"
                style="padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-primary);"
                onchange="updateSSComparisonChart()">
                <option value="annual">Annual View</option>
                <option value="cumulative">Lifetime Total</option>
            </select>
        </div>
    </div>

    <div class="stats-row" style="margin-bottom: 1rem; justify-content: space-around; text-align: center;">
        <div class="stat-item" id="ssComparisonBox62">
            <div class="label">Age 62</div>
            <div class="value" id="ss62" style="font-size: 1rem;">$1,800/mo</div>
            <div class="label" id="ss62Lifetime" style="font-size: 0.8rem; color: var(--text-muted);">Life: $700k</div>
        </div>
        <div class="stat-item" id="ssComparisonBox67">
            <div class="label">Age 67 (FRA)</div>
            <div class="value" id="ss67" style="font-size: 1rem;">$2,739/mo</div>
            <div class="label" id="ss67Lifetime" style="font-size: 0.8rem; color: var(--text-muted);">Life: $900k</div>
        </div>
        <div class="stat-item" id="ssComparisonBox70">
            <div class="label">Age 70</div>
            <div class="value" id="ss70" style="font-size: 1rem;">$3,500/mo</div>
            <div class="label" id="ss70Lifetime" style="font-size: 0.8rem; color: var(--text-muted);">Life: $1.1M</div>
        </div>
    </div>

    <div class="chart-container large">
        <canvas id="chartSSComparison"></canvas>
    </div>
</div>
