<!-- Savings Gap Calculator -->
<div class="card span-2" id="section-gapcalc">
    <div class="card-header">
        <div class="card-title">
            <span>&#127919; "What You Need" Calculator</span>
            <a href="#dashboard-top" class="back-to-top-btn">↑ Top</a>
        </div>
    </div>
    <div style="padding: 20px; display: flex; flex-direction: column; gap: 15px;">
        <div class="metric-row">
            <span class="metric-label">Target Monthly Income</span>
            <input type="number" id="calcTargetIncome" class="modern-input" value="12000"
                onchange="initGapCalculator()">
        </div>
        <div class="metric-row">
            <span class="metric-label">Projected Monthly Income</span>
            <span class="metric-value" id="calcProjectedIncome">$0</span>
        </div>
        <div id="calcSubtitle"
            style="font-size: 0.75rem; color: var(--text-muted); text-align: right; margin-top: -10px;">At
            Retirement: Age 53 (2029)</div>
        <hr style="border-color: var(--border-color);">
        <div class="metric-row">
            <span class="metric-label" id="calcResultLabel">Status</span>
            <span class="metric-value" id="calcResultValue" style="font-weight: 800;">Calculated...</span>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="calcProgressBar" style="width: 0%"></div>
        </div>
    </div>
</div>
