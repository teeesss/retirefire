<div class="card" id="section-withdrawals">
    <div class="card-header">
        <div class="card-title">
            <span>&#128184; Withdrawal Strategy</span>
            <a href="#dashboard-top" class="back-to-top-btn">↑ Top</a>
        </div>
    </div>
    <div class="chart-container large">
        <canvas id="chartWithdrawal"></canvas>
    </div>
    <div class="legend"
        style="display: flex; gap: 10px; justify-content: center; margin-top: 10px; font-size: 0.65rem; flex-wrap: wrap;">

                style="background: #64748b; width: 8px; height: 8px; display: inline-block;"></span> SS</div>
        <div class="legend-item"><span class="legend-color"
                style="background: #84cc16; width: 8px; height: 8px; display: inline-block;"></span> Cash</div>
        <div class="legend-item"><span class="legend-color"
                style="background: #f59e0b; width: 8px; height: 8px; display: inline-block;"></span> Taxable</div>
        <div class="legend-item"><span class="legend-color"
                style="background: #3b82f6; width: 8px; height: 8px; display: inline-block;"></span> Deferred</div>
        <div class="legend-item"><span class="legend-color"
                style="background: #8b5cf6; width: 8px; height: 8px; display: inline-block;"></span> HSA</div>
        <div class="legend-item"><span class="legend-color"
                style="background: #10b981; width: 8px; height: 8px; display: inline-block;"></span> Roth</div>
    </div>
</div>
