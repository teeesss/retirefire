<!-- Withdrawal Strategy Charts -->
<div class="card span-6" id="section-withdrawals">
    <div class="card-header">
        <div class="card-title">&#128184; Withdrawal Strategy & Drawdown</div>
    </div>
    <div class="chart-container large">
        <canvas id="chartWithdrawal"></canvas>
    </div>
    <div class="legend"
        style="display: flex; gap: 15px; justify-content: center; margin-top: 10px; font-size: 0.75rem; flex-wrap: wrap;">
        <div class="legend-item"><span class="legend-color"
                style="background: #3b82f6; width: 10px; height: 10px; display: inline-block; border-radius: 2px; margin-right: 4px;"></span>
            Social Security</div>
        <div class="legend-item"><span class="legend-color"
                style="background: #f59e0b; width: 10px; height: 10px; display: inline-block; border-radius: 2px; margin-right: 4px;"></span>
            Taxable</div>
        <div class="legend-item"><span class="legend-color"
                style="background: #8b5cf6; width: 10px; height: 10px; display: inline-block; border-radius: 2px; margin-right: 4px;"></span>
            Tax-Deferred</div>
        <div class="legend-item"><span class="legend-color"
                style="background: #10b981; width: 10px; height: 10px; display: inline-block; border-radius: 2px; margin-right: 4px;"></span>
            Roth IRA</div>
    </div>
</div>

<div class="card span-6">
    <div class="card-header">
        <div class="card-title">&#128201; Safe Withdrawal Rate Analysis</div>
    </div>
    <div class="chart-container large">
        <canvas id="chartSWR"></canvas>
    </div>
    <div class="legend" style="display: flex; gap: 20px; justify-content: center; margin-top: 10px;">
        <div class="legend-item"><span class="legend-color"
                style="background: #10b981; width: 12px; height: 12px; display: inline-block; border-radius: 50%; margin-right: 5px;"></span>
            Your Rate</div>
        <div class="legend-item"><span class="legend-color"
                style="background: #f59e0b; width: 12px; height: 12px; display: inline-block; border-radius: 50%; margin-right: 5px;"></span>
            4% Rule</div>
        <div class="legend-item"><span class="legend-color"
                style="background: #ef4444; width: 12px; height: 12px; display: inline-block; border-radius: 50%; margin-right: 5px;"></span>
            Danger Zone</div>
    </div>
</div>
