<div class="card" id="section-whatif">
    <div class="card-header">
        <div class="card-title">
            <span>&#128300; What-If Scenario Explorer</span>
            <a href="#dashboard-top" class="back-to-top-btn">↑ Top</a>
        </div>
    </div>
    <div class="explorer-grid"
        style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px;">
        <button class="explorer-card" onclick="runWhatIf('crash55', this)"
            style="padding: 10px; background: rgba(0,0,0,0.03); border-radius: 8px; cursor: pointer; border: 1px solid transparent;">
            <strong style="display: block; font-size: 0.8rem;">Market Crash</strong>
        </button>
        <button class="explorer-card" onclick="runWhatIf('bear', this)"
            style="padding: 10px; background: rgba(0,0,0,0.03); border-radius: 8px; cursor: pointer; border: 1px solid transparent;">
            <strong style="display: block; font-size: 0.8rem;">Bear Market</strong>
        </button>
        <button class="explorer-card" onclick="runWhatIf('healthcare', this)"
            style="padding: 10px; background: rgba(0,0,0,0.03); border-radius: 8px; cursor: pointer; border: 1px solid transparent;">
            <strong style="display: block; font-size: 0.8rem;">Medical Event</strong>
        </button>
        <button class="explorer-card highlight" onclick="runWhatIf('baseline', this)"
            style="padding: 10px; background: var(--bg-hover); border-radius: 8px; cursor: pointer; border: 1px solid var(--primary);">
            <strong style="display: block; font-size: 0.8rem;">Reset</strong>
        </button>
    </div>
    <div class="chart-container large" style="margin-top: 15px;">
        <canvas id="chartWhatIf"></canvas>
    </div>
    <div class="stats-row"
        style="margin-top: 10px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center;">
        <div class="stat-item">
            <div class="label" style="font-size: 0.65rem;">Final NW</div>
            <div class="value" id="whatIfNW95" style="font-size: 0.9rem;">$0</div>
        </div>
        <div class="stat-item">
            <div class="label" style="font-size: 0.65rem;">Success</div>
            <div class="value" id="whatIfSuccess" style="font-size: 0.9rem;">100%</div>
        </div>
        <div class="stat-item">
            <div class="label" style="font-size: 0.65rem;">Legacy</div>
            <div class="value" id="whatIfLegacy" style="font-size: 0.9rem;">Yes</div>
        </div>
    </div>
</div>
