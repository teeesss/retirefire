<!-- Year Data Detailed Modal -->
<div id="yearDataModal" class="modal-overlay" style="display: none;">
    <div class="modal-content"
        style="max-width: 1200px; width: 95%; max-height: 90vh; display: flex; flex-direction: column;">
        <div class="modal-header">
            <h3>&#128203; Year-by-Year Financial Data</h3>
            <button class="modal-close" onclick="closeModal('yearDataModal')">&times;</button>
        </div>
        <div class="modal-body" style="flex: 1; overflow: hidden; display: flex; flex-direction: column; padding: 0;">
            <!-- Copied from data-tables.html -->
            <div class="card" id="modal-section-tables"
                style="border: none; box-shadow: none; height: 100%; display: flex; flex-direction: column;">
                <div class="card-header" style="flex-shrink: 0;">
                    <div class="tab-container" id="tableTabs" style="display: flex; gap: 5px; flex-wrap: wrap;">
                        <button class="tab active" onclick="showDataTable('summary', this)">Summary</button>
                        <button class="tab" onclick="showDataTable('accounts', this)">Accounts</button>
                        <button class="tab" onclick="showDataTable('income', this)">Income</button>
                        <button class="tab" onclick="showDataTable('expenses', this)">Expenses</button>
                        <button class="tab" onclick="showDataTable('taxes', this)">Taxes</button>
                        <button class="tab" onclick="showDataTable('roth', this)">Roth</button>
                        <button class="tab" onclick="showDataTable('cashflow', this)">Cash Flow</button>
                    </div>
                    <div class="card-actions" style="display: flex; gap: 5px;">
                        <button class="btn btn-outline btn-sm" onclick="exportPDF()">&#128229; PDF</button>
                        <button class="btn btn-outline btn-sm" onclick="exportCSV()">&#128228; CSV</button>
                    </div>
                </div>
                <!-- Table Container with Scroll -->
                <div class="table-container" id="dataTableContainer"
                    style="overflow: auto; margin-top: 10px; flex: 1; border-radius: 8px; border: 1px solid var(--border-color);">
                    <!-- Populated by JS (showDataTable) -->
                </div>
            </div>
        </div>
    </div>
</div>
