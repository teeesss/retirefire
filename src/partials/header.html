<header>
    <div class="header-top">
        <div class="header-title" style="display: flex; align-items: center; gap: 1rem;">
            <button class="menu-toggle" onclick="window.toggleSidebar()" title="Toggle Menu"
                style="display: none; background: transparent; border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 4px; width: 36px; height: 36px; align-items: center; justify-content: center; font-size: 1.25rem;">☰</button>
            <div>
                <h1>&#128202; Retirement Financial Planner Pro</h1>
                <p>Comprehensive 45-year projection • Interactive Dashboard • Multi-Scenario Analysis</p>
            </div>
        </div>
        <div class="header-actions">
            <div class="sync-indicator">
                <span class="sync-dot"></span>
                <span>Auto-saved</span>
            </div>
            <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Theme">🌙</button>
            <button class="btn btn-outline" onclick="openSettings()">&#9881; <span
                    class="btn-label">Settings</span></button>
            <button class="btn btn-outline" onclick="exportPDF()">📄 <span class="btn-label">PDF</span></button>
            <button class="btn btn-outline" onclick="exportCSV()">&#128202; <span class="btn-label">CSV</span></button>
            <button class="btn btn-outline" onclick="exportJSON()">💾 <span class="btn-label">Save</span></button>
            <button class="btn btn-primary" onclick="recalculate()">&#128260; <span
                    class="btn-label">Recalculate</span></button>
        </div>
    </div>
    <div class="header-controls">
        <span style="font-size: 0.8rem; color: var(--text-muted); margin-right: 0.5rem;">&#128202; View
            Scenario:</span>
        <div class="scenario-toggle" id="scenarioButtons">
            <button class="scenario-btn optimistic" onclick="setScenario('optimistic', this)">✨ Optimistic</button>
            <button class="scenario-btn average active" onclick="setScenario('average', this)">📊 Average</button>
            <button class="scenario-btn pessimistic" onclick="setScenario('pessimistic', this)">⚡ Pessimistic</button>

        </div>
    </div>
</header>
